<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-label="المختار لإدارة المشروعات">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff1bc"/><stop offset=".3" stop-color="#e8bb59"/><stop offset=".7" stop-color="#b47c27"/><stop offset="1" stop-color="#ffe7a0"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193d5c"/><stop offset="1" stop-color="#020812"/></linearGradient>
 <filter id="textshadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<image href="/al-mokhtar-mark.svg" x="310" y="0" width="380" height="380"/>
<text x="500" y="535" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="116" font-weight="900" fill="url(#gold)" stroke="#6f4c1e" stroke-width="2" paint-order="stroke" filter="url(#textshadow)" direction="rtl" unicode-bidi="plaintext">المختار</text>
<path d="M180 574H820" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
<text x="500" y="649" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="55" font-weight="800" fill="#f8e5ad" stroke="#76521d" stroke-width=".8" paint-order="stroke" direction="rtl" unicode-bidi="plaintext">لإدارة المشروعات</text>
<text x="500" y="710" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="25" font-weight="600" fill="#cad8e6" direction="rtl" unicode-bidi="plaintext">إدارة متكاملة للمول والمباني الإدارية والسكنية والفندق</text>
<g fill="url(#gold)" stroke="#7d5924" stroke-width="1.3" filter="url(#textshadow)">
 <rect x="120" y="759" width="760" height="82" rx="20" fill="url(#navy)" stroke="url(#gold)" stroke-width="2"/>
 <path d="M310 775V825M500 775V825M690 775V825" stroke="#d5ad5d" stroke-opacity=".65" stroke-width="1.5"/>
 <text x="215" y="810" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">المول التجاري</text>
 <text x="405" y="810" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">المبنى الإداري</text>
 <text x="595" y="810" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">المبنى السكني</text>
 <text x="785" y="810" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">الفندق</text>
